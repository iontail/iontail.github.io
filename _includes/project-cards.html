<div class="project-page-list">
  {% for project in include.projects %}
    <div class="portfolio-card" data-card-motion>
      <a class="project-card portfolio-card__surface" href="{{ project.url | relative_url }}">
        {% if project.image %}
          <span class="project-card__media">
            <img src="{{ project.image | relative_url }}" alt="" class="project-card__image">
          </span>
        {% endif %}
        <div class="project-card__text">
          <h2>{{ project.title }}</h2>
          <p>{{ project.description }}</p>
        </div>
      </a>
    </div>
  {% endfor %}
</div>
