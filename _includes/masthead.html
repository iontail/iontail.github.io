<a class="masthead__skip" href="#main">Skip to content</a>
<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="masthead__brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.name }}</a>
    <nav class="masthead__nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign nav_url = link.url %}
        {% else %}
          {% assign nav_url = link.url | relative_url %}
        {% endif %}
        <a href="{{ nav_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
